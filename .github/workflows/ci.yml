name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# the changelog has its own workflow (changelog.yml)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # a decoder bug can hang a test; don't let it burn the default six hours
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The tests need the 137 MB model, which isn't in the repo. The key is its
      # SHA-256 (MODEL_SHA256 in src/upgrade.rs), so a new model gets a new
      # cache, and the cache is only saved when the job passes, which needs the
      # download to have passed hamzip's hash check.
      - name: Cache the model
        id: model
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ runner.os }}-4f3b006a37c45d5f7ac496eba7bae7deef47661feeed1891b3340e18b4b9c919

      - name: Download the model
        if: steps.model.outputs.cache-hit != 'true'
        run: cargo run --release -- model download --to models

      # the profile the release binaries are built with
      - name: Run tests
        run: cargo test

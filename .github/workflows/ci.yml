name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# the changelog has its own workflow (changelog.yml)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # a decoder bug can hang a test; don't let it burn the default six hours
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # what eframe's README lists for building on Linux
      - name: Install the window's build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      # default-members keeps the window out of plain clippy and test. Its
      # tests need no model and no display.
      - name: Clippy (window)
        run: cargo clippy -p hamzip-gui --all-targets -- -D warnings

      - name: Test the window
        run: cargo test -p hamzip-gui

      # The tests need the 137 MB model, which isn't in the repo. The key is its
      # SHA-256 (the first entry of MODELS in src/lib.rs), so a new model gets a new
      # cache, and the cache is only saved when the job passes, which needs the
      # download to have passed hamzip's hash check.
      - name: Cache the model
        id: model
        uses: actions/cache@v6
        with:
          path: models
          key: model-${{ runner.os }}-4f3b006a37c45d5f7ac496eba7bae7deef47661feeed1891b3340e18b4b9c919

      - name: Download the model
        if: steps.model.outputs.cache-hit != 'true'
        run: cargo run --release -- model download --to models

      # the test profile keeps overflow checks on, so an arithmetic slip fails loudly
      - name: Run tests
        run: cargo test

      # the shipped build has lto and no overflow checks; it must give the same bytes
      - name: Golden vectors with the release profile
        run: cargo test --release --test golden

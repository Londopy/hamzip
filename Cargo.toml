[package]
name = "hamzip"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Text compression for slow amateur radio data links using a small language model both stations share"
repository = "https://github.com/Londopy/hamzip"
authors = ["Londopy"]

[workspace]
members = [".", "gui"]
# the GUI pulls in a windowing stack; keep plain `cargo test` and `cargo build` headless
default-members = ["."]
resolver = "2"

[dependencies]
clap = { version = "4.6.8", features = ["derive", "env"] }
crc32fast = "1.5.5"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
zstd = "0.14.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# the engine is unusably slow unoptimized; keep overflow checks on so tests catch overflow
[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3

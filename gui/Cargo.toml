[package]
name = "hamzip-gui"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Desktop window for hamzip: compress, decode and inspect messages for slow radio links"
repository = "https://github.com/Londopy/hamzip"
authors = ["Londopy"]

[dependencies]
hamzip = { path = ".." }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.18.0"

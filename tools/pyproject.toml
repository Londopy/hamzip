[project]
name = "hamzip-tools"
version = "0.1.0"
description = "Corpus, baseline and model conversion scripts for hamzip"
authors = [{ name = "Londopy", email = "Londopy@protonmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "zstandard>=0.25.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# the cpu wheel is ~200 MB instead of several GB; a 135M model doesn't need a gpu
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
